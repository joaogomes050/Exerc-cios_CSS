<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaboradores</title>

<style>

*{
    margin: 0;
    padding: 0;
}

.titulo{
    background-color: rgb(0, 0, 0);
    text-transform: uppercase;
    text-align: center;
    padding: 30px;
    color: white;
}

.conteudo{
    background-image: linear-gradient(to bottom, rgb(0, 0, 0), rgb(128, 5, 5), rgb(255, 4, 4));
    
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;

    justify-content: space-around;
    align-items: center;
}

.item{
    width: 20%;
    height: 200px;
    margin: 10px;

    background: rgb(244, 241, 241);

    flex-grow: 0;
    flex-shrink: 1;

    border-radius: 10px;

    background-size: 90%;
    background-repeat: no-repeat;
    background-position: center;
    background-color: rgb(252, 252, 252);
}

.item:hover{
    width: 30%;
    height: 300px;
}

.itemA{
   background-image: url(img/alberto.jpg);
} 

.itemB{
    background-image: url(img/depay.jpg);
}

.itemC{
    background-image: url(img/garroo.jpg);
}

.itemD{
    background-image: url(img/hugo.jpg);
}

</style>
</head>

<body>

<div class="titulo">
    <h1>JOGADORES</h1>
</div>

<div class="conteudo">

    <div class="item itemA"></div>
    <div class="item itemB"></div>
    <div class="item itemC"></div>
    <div class="item itemD"></div>

    <div class="item itemA"></div>
    <div class="item itemB"></div>
    <div class="item itemC"></div>
    <div class="item itemD"></div>

    <div class="item itemA"></div>
    <div class="item itemB"></div>
    <div class="item itemC"></div>
    <div class="item itemD"></div>

</div>

</body>
</html>
